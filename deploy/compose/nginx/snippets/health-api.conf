# 在 PC 和 App 两个 server { } 里分别 include 本文件
# Compose 网络内通过服务名 backend 访问后端，不再使用 127.0.0.1

# AI 流式接口：必须关闭缓冲，否则会等整段回答生成完才一次性返回
location = /api/ai/consultation/ask/stream {
    proxy_pass http://backend:8888/api/ai/consultation/ask/stream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    add_header X-Accel-Buffering no;
    proxy_read_timeout 200s;
    proxy_send_timeout 200s;
}

# 普通接口（同步 AI/计划最长约 165 秒，所以超时给 200 秒）
location /api/ {
    proxy_pass http://backend:8888/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 200s;
    proxy_send_timeout 200s;
}

# 本地存储模式的打卡照片
location /uploads/ {
    proxy_pass http://backend:8888/uploads/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;
}
