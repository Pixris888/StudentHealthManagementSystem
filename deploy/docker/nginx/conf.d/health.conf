# 服务器位置：/opt/project/docker/nginx/conf.d/health.conf
# 容器内挂载：html -> /var/www，snippets -> /etc/nginx/snippets
# 先走公网 IP + HTTP：PC 80，App H5 8080

# ---------- PC 管理端 ----------
server {
    listen 80 default_server;
    server_name _;

    root /var/www/health-pc;
    index index.html;

    # 打卡照片/Excel 导入；Nginx 默认 1M 会 413
    client_max_body_size 20m;

    include /etc/nginx/snippets/health-api.conf;

    # 学生端下载页 + APK：让 PC 站点也能直接提供扫码下载地址
    location /download/ {
        alias /var/www/download/;
        index index.html;
    }

    location = /download {
        return 301 /download/;
    }

    location = /download/health-app.apk {
        alias /var/www/download/health-app.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition "attachment";
        add_header Cache-Control "no-store";
    }

    # PC 使用 history 路由，刷新 /ai 等页面不能 404
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ---------- 学生端 H5 + 下载页 ----------
server {
    listen 8080 default_server;
    server_name _;

    root /var/www/health-app;
    index index.html;

    client_max_body_size 20m;

    include /etc/nginx/snippets/health-api.conf;

    location /download/ {
        alias /var/www/download/;
        index index.html;
    }

    location = /download {
        return 301 /download/;
    }

    location = /download/health-app.apk {
        alias /var/www/download/health-app.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition "attachment";
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
