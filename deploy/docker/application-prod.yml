# 服务器位置：/opt/project/backend/config/application-prod.yml
# 启动方式：java -jar ... --spring.profiles.active=prod
# 敏感信息全部来自 /opt/project/backend/.env（docker --env-file 注入）

server:
  port: 8888
  # 后端容器使用 --network host，只监听宿主机回环，外部统一走 Nginx
  address: 127.0.0.1

spring:
  datasource:
    url: "jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:health_management}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true"
    username: "${DB_USERNAME:health}"
    password: "${DB_PASSWORD}"
    driver-class-name: com.mysql.cj.jdbc.Driver
  redis:
    host: "${REDIS_HOST:127.0.0.1}"
    port: ${REDIS_PORT:6379}
    password: "${REDIS_PASSWORD:}"
    timeout: 3000ms

# 生产环境不要打印 SQL，避免健康问答内容进入日志
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

storage:
  type: local
  local-path: "${UPLOAD_DIR:/opt/project/files}"
  url-prefix: /uploads

health:
  ai:
    # 未配置时百炼会被跳过，最终走规则兜底
    api-key: "${DASHSCOPE_API_KEY:}"
    fallback:
      # 服务器没装 Ollama 时关闭，避免无意义的 120 秒等待
      enabled: ${AI_FALLBACK_ENABLED:false}
  backup:
    dir: "${BACKUP_DIR:/opt/project/backup}"

# 必须通过环境变量提供，不要使用仓库里的示例密钥
jwt:
  secret: "${JWT_SECRET}"

logging:
  file:
    name: "${LOG_DIR:/opt/project/logs}/health-management.log"
  level:
    root: info
  logback:
    rollingpolicy:
      max-file-size: 20MB
      max-history: 7
